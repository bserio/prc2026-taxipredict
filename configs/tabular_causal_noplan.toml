name = "causal-noplan"
kind = "lightgbm"
track = "causal"
train_filter = false             # D-011 : exclure la queue coute +2,3 % (causal-r4-filtered)

# Variante d'audit (prolongement de D-035) : que coute une prédiction qui n'utilise AUCUN
# des trois champs de planification du poussage (EOBT_1, IOBT, LOBT) ni leurs indicateurs
# d'absence ? Les six variables retirees : d_eobt_min, miss_EOBT_1_flt, d_iobt_min,
# miss_IOBT_flt (via le script d'audit qui les supprime apres transform) et d_lobt_min,
# miss_LOBT_flt (via plan_lobt = false). Tout le reste est identique a tabular_causal.toml.
# Repond a la question de l'hypothese de conception : si ces champs etaient en realite
# ecrits apres le poussage, quel serait le pire cas pour la piste causale ?

[features]
calendar = true                 # depuis SCHED_TIME_UTC_mvt (horaire publie, connu d'avance)
airport = true                  # ADEP_mvt
aircraft = true                 # AIRCRAFT_TYPE_mvt/_flt, WK_TBL_CAT_flt
ops = true                      # MARKET_SEGMENT_flt, FLIGHT_RULE_*, FLIGHT_TYPE_flt
operator_enc = true             # AIRCRAFT_OPERATOR_flt : codage cible lisse (train uniquement)
stand_enc = true                # STAND_mvt : codage cible lisse (train uniquement)
geometry = true                 # offsets stand/piste appris du taxi-in des ARRIVÉES des mois d'entraînement
expected_runway_distance = true # somme_r P(r|stand,heure) * d(stand,r), estimé sur les mois d'entraînement
plan_delay = true               # (supprimé à l'exécution par le script d'audit : noplan)
plan_lobt = false               # RETIRE : ecart a LOBT_flt + indicateur miss_LOBT_flt
congestion_planned = true       # arrivées et départs PLANIFIÉS par créneau (SCHED_TIME) + ratio de capacité
history_enc = true              # moyennes cibles lissées aéroport×heure, aéroport×jour+créneau (train uniquement)

[features.forbidden]
# Interdits dans cette piste : informations postérieures à l'off-block.
mvt_time = true
aobt_3 = true
block_time = true
taxitime_as_feature = true
runway_actual = true

[lightgbm]
objective = "regression"        # L2 = metrique officielle
learning_rate = 0.05
num_leaves = 96
min_data_in_leaf = 200
feature_fraction = 0.8
bagging_fraction = 0.8
bagging_freq = 1
lambda_l2 = 1.0
num_threads = 12
seed = 7
num_boost_round = 4000
early_stopping_round = 150

[budget]
max_runtime_s = 1200
max_mem_gib = 60
