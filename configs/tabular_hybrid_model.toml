name = "hybrid-model"
kind = "lightgbm"
track = "hybrid"                 # le proxy et les debits realises entrent comme variables
train_filter = false             # les cibles aberrantes restent dans l'apprentissage (L2 = moyenne conditionnelle)

[features]
runway_actual = true

[lightgbm]
objective = "regression"
learning_rate = 0.05
num_leaves = 96
min_data_in_leaf = 200
feature_fraction = 0.8
bagging_fraction = 0.8
bagging_freq = 1
lambda_l2 = 1.0
num_threads = 12
seed = 7
num_boost_round = 4000
early_stopping_round = 150

[budget]
max_runtime_s = 1200
max_mem_gib = 60
